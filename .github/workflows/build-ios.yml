name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Clean iOS platform
      run: |
        rm -rf ios
        npx cap add ios

    - name: Generate app icons
      run: |
        mkdir -p resources
        if [ ! -f resources/icon.png ] && [ ! -f resources/icon.svg ] && [ -f resources/ico.svg ]; then
          cp resources/ico.svg resources/icon.svg
        fi
        npx capacitor-assets generate --ios || true

    - name: Sync iOS project
      run: npx cap sync ios

    - name: Configure Info.plist
      run: |
        INFO_PLIST="ios/App/App/Info.plist"
        /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$INFO_PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$INFO_PLIST"
        /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$INFO_PLIST"

    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install

    - name: Build iOS App
      run: |
        cd ios/App
        xcodebuild clean build \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO \
          SYMROOT=$(pwd)/build

    - name: Find and package IPA
      run: |
        cd ios/App
        # Find the built .app file in the build directory
        APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
        echo "Found app at: $APP_PATH"
        
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app file found in build directory"
          echo "Contents of build directory:"
          find build -type f -name "*.app" 2>/dev/null || echo "No .app files found"
          ls -la build/ 2>/dev/null || echo "No build directory"
          exit 1
        fi
        
        # Create IPA structure
        cd /Users/jinsongchen/Downloads/android-app
        mkdir -p ipa/Payload
        cp -r "ios/App/$APP_PATH" ipa/Payload/

    - name: Create IPA file
      run: |
        cd ipa
        zip -r ../ZKMODELS.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ZKMODELS.ipa
